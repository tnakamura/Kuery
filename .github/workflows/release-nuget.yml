name: Release NuGet Package

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Determine package version from release tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          # Accept v1.2.3 and v1.2.3-preview.1, with SemVer prerelease identifiers.
          NUMBER='(0|[1-9][0-9]*)'
          IDENTIFIER="($NUMBER|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          if [[ ! "$TAG_NAME" =~ ^v$NUMBER\.$NUMBER\.$NUMBER(-$IDENTIFIER(\.$IDENTIFIER)*)?$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease (for example, v0.2.0-preview.1)."
            exit 1
          fi
          echo "PACKAGE_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"

      - name: Validate NuGet configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "::error::Set the NUGET_USER repository variable to your NuGet.org username. See docs/publishing.md."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Kuery.slnx

      - name: Build
        run: dotnet build Kuery.slnx --configuration Release --no-restore -p:Version="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true

      - name: Run fast tests
        run: bash test/run-fast-tests.sh --configuration Release --no-build --nologo

      - name: Run integration tests
        run: bash test/run-integration-tests.sh --configuration Release --no-build --nologo

      - name: Pack
        run: dotnet pack src/Kuery/Kuery.csproj --configuration Release --no-build --output artifacts -p:Version="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
